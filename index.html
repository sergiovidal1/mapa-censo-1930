      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Panel Lateral (Sidebar) */
    #sidebar {
      width: 360px;
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }
    .header-sidebar {
      background-color: #8b0000;
      color: white;
      padding: 15px;
    }
    .header-sidebar h2 {
      margin: 0 0 5px 0;
      font-size: 1.25em;
    }
    .header-sidebar p {
      margin: 0;
      font-size: 0.85em;
      opacity: 0.9;
    }
    .stats-container {
      display: flex;
      background-color: #700000;
      padding: 10px 15px;
      color: white;
      text-align: center;
    }
    .stat-box {
      flex: 1;
    }
    .stat-number {
      font-size: 1.2em;
      font-weight: bold;
    }
    .stat-label {
      font-size: 0.75em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .search-box {
      padding: 10px 15px;
      background-color: #e9ecef;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px;
    }
    .family-group {
      background-color: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 10px;
      padding: 10px;
    }
    .family-head {
      font-weight: bold;
      font-size: 0.92em;
      padding-bottom: 5px;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 5px;
    }

    .family-head.mujer { color: #8e44ad; }
    
    .member-item {
      font-size: 0.83em;
      color: #555;
      padding: 2px 0;
    }
