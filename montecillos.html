<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Censo 1930 - Comunidad Montecillos</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Panel Lateral (Sidebar) */
    #sidebar {
      width: 360px;
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }
    .header-sidebar {
      background-color: #8b0000;
      color: white;
      padding: 15px;
    }
    .header-sidebar h2 {
      margin: 0 0 5px 0;
      font-size: 1.25em;
    }
    .header-sidebar p {
      margin: 0;
      font-size: 0.85em;
      opacity: 0.9;
    }
    .stats-container {
      display: flex;
      background-color: #700000;
      padding: 10px 15px;
      color: white;
      text-align: center;
    }
    .stat-box {
      flex: 1;
    }
    .stat-number {
      font-size: 1.2em;
      font-weight: bold;
    }
    .stat-label {
      font-size: 0.75em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .search-box {
      padding: 10px 15px;
      background-color: #e9ecef;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px;
    }
    .family-group {
      background-color: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 10px;
      padding: 10px;
    }
    .family-head {
      font-weight: bold;
      font-size: 0.92em;
      padding-bottom: 5px;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 5px;
    }
    .family-head.hombre { color: #2980b9; }
    .family-head.mujer { color: #8e44ad; }
    
    .member-item {
      font-size: 0.83em;
      color: #555;
      padding: 2px 0;
    }

    /* Mapa */
    #mapa {
      flex: 1;
      height: 100%;
    }

    /* Popups y Tooltips */
    .popup-censo {
      max-width: 280px;
    }
    .popup-censo h3 {
      margin: 0 0 5px 0;
      color: #8b0000;
    }
    .etiqueta-comunidad {
      background-color: #8b0000;
      color: #ffffff;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- Panel de navegación e información lateral -->
  <div id="sidebar">
    <div class="header-sidebar">
      <h2>Montecillos</h2>
      <p>Comunidad Montecillos &bull; Censo 1930</p>
    </div>
    
    <div class="stats-container">
      <div class="stat-box">
        <div class="stat-number">11</div>
        <div class="stat-label">Habitantes</div>
      </div>
      <div class="stat-box">
        <div class="stat-number">2</div>
        <div class="stat-label">Familias</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="inputBuscador" placeholder="Buscar habitante..." onkeyup="filtrarHabitantes()">
    </div>

    <div class="list-container" id="listaCenso">
      <!-- Se genera dinámicamente con JS -->
    </div>

    <!-- Pie de página con aviso de derechos de autor -->
    <div style="padding: 10px; font-size: 0.75em; text-align: center; color: #666; border-top: 1px solid #ddd; background: #fff;">
      © 2026 Sergio Vidal — Proyecto de Investigación Censo 1930.<br>
      Comunidad Montecillos. Todos los derechos reservados.<br>
      <i>Prohibida su copia o redistribución sin autorización explícita.</i>
    </div>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="mapa"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Coordenadas específicas para Montecillos
    var coordsMontecillos = [20.61648, -102.46153];

    // Inicializar mapa centrado en Montecillos
    var map = L.map('mapa').setView(coordsMontecillos, 15);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Censo 1930',
      maxZoom: 18
    }).addTo(map);

    // Listado de las familias de Montecillos extraído directamente del censo
    var familiasMontecillos = [
      {
        jefe: { nombre: "Apolonia Arias", edad: "74 años", sexo: "Mujer" },
        integrantes: [
          { nombre: "Francisca Alvarez", edad: "54 años", sexo: "Mujer" },
          { nombre: "Julia Alvarez", edad: "47 años", sexo: "Mujer" },
          { nombre: "Maria Alvarez", edad: "17 años", sexo: "Mujer" }
        ]
      },
      {
        jefe: { nombre: "Jose Maria Alvarez", edad: "45 años", sexo: "Hombre" },
        integrantes: [
          { nombre: "Luisa Arriaga", edad: "35 años", sexo: "Mujer" },
          { nombre: "Adalberto Alvarez", edad: "15 años", sexo: "Hombre" },
          { nombre: "Manuel Alvarez", edad: "13 años", sexo: "Hombre" },
          { nombre: "Lucia Alvarez", edad: "10 años", sexo: "Mujer" },
          { nombre: "Josefa Alvarez", edad: "3 años", sexo: "Mujer" },
          { nombre: "Jose Alvarez", edad: "5 meses", sexo: "Hombre" }
        ]
      }
    ];

    // Renderizar la lista lateral de familias
    function renderizarLista(familias) {
      var contenedor = document.getElementById('listaCenso');
      contenedor.innerHTML = '';

      familias.forEach(function(fam) {
        var esHombre = fam.jefe.sexo === "Hombre";
        var icono = esHombre ? "👨" : "👩";
        var claseHead = esHombre ? "hombre" : "mujer";

        var htmlFam = `
          <div class="family-group">
            <div class="family-head ${claseHead}">
              ${icono} ${fam.jefe.nombre} (${fam.jefe.edad})
            </div>
        `;

        fam.integrantes.forEach(function(m) {
          htmlFam += `<div class="member-item">&bull; ${m.nombre} (${m.edad}, ${m.sexo})</div>`;
        });

        htmlFam += `</div>`;
        contenedor.innerHTML += htmlFam;
      });
    }

    // Filtrar habitantes mediante el buscador
    function filtrarHabitantes() {
      var texto = document.getElementById('inputBuscador').value.toLowerCase();
      
      if (!texto) {
        renderizarLista(familiasMontecillos);
        return;
      }

      var familiasFiltradas = familiasMontecillos.filter(function(fam) {
        var coincideJefe = fam.jefe.nombre.toLowerCase().includes(texto);
        var coincideIntegrante = fam.integrantes.some(function(m) {
          return m.nombre.toLowerCase().includes(texto);
        });
        return coincideJefe || coincideIntegrante;
      });

      renderizarLista(familiasFiltradas);
    }

    // Renderizado inicial
    renderizarLista(familiasMontecillos);

    // Agregar marcador único en el mapa para la comunidad de Montecillos
    var marker = L.marker(coordsMontecillos).addTo(map);
    
    var popupContent = `
      <div class="popup-censo">
        <h3>Montecillos</h3>
        <p><b>Comunidad:</b> Montecillos</p>
        <p><b>Población total:</b> 11 personas</p>
        <p><b>Total de familias:</b> 2</p>
        <hr>
        <small>Utiliza el panel lateral para consultar el padrón de habitantes y realizar búsquedas por nombre.</small>
      </div>
    `;

    marker.bindPopup(popupContent).openPopup();
    
    marker.bindTooltip("Montecillos", {
      permanent: true,
      direction: 'top',
      className: 'etiqueta-comunidad',
      offset: [0, -10]
    });
  </script>

</body>
</html>
